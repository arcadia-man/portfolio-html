<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="JetBrains Mono, ui-monospace, monospace">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111116"/><stop offset="1" stop-color="#34343c"/></linearGradient>
    <radialGradient id="l" cx=".7" cy=".15" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#g)"/><rect width="1200" height="675" fill="url(#grid)"/><rect width="1200" height="675" fill="url(#l)"/>
  <g fill="#ffffff" opacity=".08" font-size="28"><text x="60" y="110">=IF(AND(a&gt;0, b&lt;10), SUM(a,b), 0)</text><text x="420" y="590">=ROUND(AVG(x, y, z), 2)</text><text x="140" y="640">=CONCAT(UPPER(name), "!")</text><text x="640" y="160">=LOOKUP(id, table)</text></g>
  <text x="600" y="330" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">f(x) =</text>
  <text x="600" y="400" font-size="26" fill="#a1a1aa" text-anchor="middle">tokenize → parse → evaluate</text>
