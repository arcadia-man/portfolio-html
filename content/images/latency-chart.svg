  <g font-size="13"><rect x="640" y="420" width="14" height="14" rx="3" fill="#d1d1d8"/><text x="662" y="432" fill="#52525c">Before</text><rect x="740" y="420" width="14" height="14" rx="3" fill="#3451d1"/><text x="762" y="432" fill="#52525c">After</text></g>
