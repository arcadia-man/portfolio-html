  <g font-size="13" fill="#6e6e78" text-anchor="end"><text x="108" y="104">900 ms</text><text x="108" y="194">600 ms</text><text x="108" y="284">300 ms</text><text x="108" y="374">0</text></g>
  <g>
    <rect x="190" y="130" width="90" height="240" rx="6" fill="#d1d1d8"/><rect x="290" y="300" width="90" height="70" rx="6" fill="#3451d1"/>
