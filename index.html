<!DOCTYPE html>
<html lang="en" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pritam Kumar Maurya — Portfolio</title>
<style>
/* =========================================================================
   INK LINE — hand-drawn sketchbook feel. Grayscale only.
   No borders anywhere; surfaces are separated by background shade
   alone. Hand-drawn character comes from marker-highlight headings,
   squiggle underlines, and sticky-note tilts.
   ========================================================================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{min-height:100vh;transition:background-color .3s ease,color .3s ease}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
ul{list-style:none}

:root{
  --g0:#ffffff; --g1:#f4f4f5; --g2:#e4e4e7; --g3:#d4d4d8;
  --g4:#a1a1aa; --g5:#71717a; --g6:#52525b; --g7:#3f3f46;
  --g8:#27272a; --g9:#18181b; --g10:#000000;

  --bg:var(--g0); --bg-band:var(--g1); --paper:var(--g0);
  --surface:var(--g2); --surface-hi:var(--g3);
  --ink:var(--g9); --ink-dim:var(--g6);
  --font:'Segoe Print','Bradley Hand','Comic Sans MS',cursive;
  --font-body:'Comic Sans MS','Segoe Print',cursive;
  --maxw:1040px;
}
[data-mode="dark"]{
  --bg:var(--g9); --bg-band:var(--g8); --paper:var(--g8);
  --surface:var(--g7); --surface-hi:var(--g6);
  --ink:var(--g1); --ink-dim:var(--g4);
}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body)}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:2.2rem;padding-right:2.2rem}

/* ---------- scroll progress bar ---------- */
#progressBar{position:fixed;top:0;left:0;height:4px;background:var(--ink);z-index:1200;width:0%;border-radius:0 3px 3px 0}

/* ---------- mini nav: slides in on scroll ---------- */
#miniNav{
  position:fixed;top:0;left:0;right:0;z-index:900;background:var(--paper);
  transform:translateY(-100%);transition:transform .35s ease;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}
#miniNav.show{transform:translateY(0)}
#miniNav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
#miniNav .brand{font-weight:700;font-size:1.2rem;transform:rotate(-2deg);display:inline-block}
#miniNav nav{display:flex;gap:1.4rem;flex-wrap:wrap}
#miniNav nav a{font-size:.85rem;color:var(--ink-dim);position:relative}
#miniNav nav a.active{color:var(--ink)}
#miniNav nav a.active::after{content:"";position:absolute;left:-4px;right:-4px;bottom:-4px;height:6px;background:var(--ink-dim);opacity:.3;border-radius:2px;transform:rotate(-1deg)}
#miniNav .modeBtn{width:36px;height:36px;border-radius:50% 48% 50% 48%;background:var(--bg-band);display:flex;align-items:center;justify-content:center}

/* ---------- top-right mode toggle ---------- */
.control-panel{position:fixed;top:14px;right:14px;z-index:999;transition:opacity .25s ease,transform .25s ease}
.control-panel.hide{opacity:0;transform:translateY(-8px);pointer-events:none}
.mode-toggle{width:54px;height:30px;border-radius:16px 14px 16px 14px;background:var(--bg-band);position:relative;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.mode-toggle svg{position:absolute;top:6px;width:16px;height:16px;transition:opacity .25s}
.mode-toggle .sun{left:7px;opacity:1}
.mode-toggle .moon{right:7px;opacity:.35}
[data-mode="dark"] .mode-toggle .sun{opacity:.35}
[data-mode="dark"] .mode-toggle .moon{opacity:1}
.mode-toggle .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50% 46% 50% 46%;background:var(--ink);transition:transform .35s cubic-bezier(.34,1.4,.64,1)}
[data-mode="dark"] .mode-toggle .knob{transform:translateX(24px) rotate(25deg)}

/* ---------- surface panel (used by cards/blocks) — background only, no border ---------- */
.sketch{position:relative;border-radius:3px 14px 4px 12px;padding:1.4rem 1.5rem;box-shadow:0 10px 24px rgba(0,0,0,.1);transition:box-shadow .2s,background .2s}
[data-mode="dark"] .sketch{background:var(--surface);box-shadow:0 10px 24px rgba(0,0,0,.35)}

/* ---------- type ---------- */
h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.15;font-weight:700}
h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:700;margin-bottom:.4rem;display:inline-block;position:relative}
h3{font-size:1.05rem;font-weight:700}
p{color:var(--ink-dim);line-height:1.7}

section{padding-top:5.5rem;padding-bottom:5.5rem}
section.band{background:var(--bg-band);border-radius:28px 10px 28px 10px}
#app > section{scroll-margin-top:84px;margin-bottom:2rem}

.reveal{opacity:0;transform:translateY(22px) rotate(-.3deg);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:translateY(0) rotate(0)}

/* ---------- squiggly underline links ---------- */
.u-link{position:relative;font-weight:700;padding-bottom:3px;display:inline-block}
.u-link svg{position:absolute;left:0;bottom:-4px;width:100%;height:8px;overflow:visible}
.u-link path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;transition:stroke-dashoffset .4s ease}
.u-link:hover path{stroke-dashoffset:0}

/* ---------- hero ---------- */
#hero{min-height:100vh;padding-top:6.5rem;padding-bottom:3rem;display:flex;flex-direction:column;justify-content:center}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:2.5rem;align-items:center}
@media (max-width:800px){ .hero-grid{grid-template-columns:1fr} .hero-photo-col{order:-1;max-width:200px;margin:0 auto 1rem} }
.hero-photo-col{width:100%}
.hero-photo{
  width:100%;max-width:320px;aspect-ratio:1;margin-inline:auto;overflow:hidden;
  border-radius:42% 58% 55% 45% / 45% 42% 58% 55%;background:var(--bg-band);
  display:flex;align-items:center;justify-content:center;position:relative;transform:rotate(-2deg);
}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:top center}
.hero-photo .fallback{font-size:3.2rem;font-weight:700;color:var(--ink-dim)}
.hero-photo-caption{text-align:center;font-size:.78rem;color:var(--ink-dim);margin-top:.7rem;font-style:italic}
#hero .tag{font-size:.85rem;color:var(--ink-dim);background:var(--bg-band);display:inline-block;padding:.4rem .9rem;border-radius:14px 4px 14px 4px;margin-bottom:1.3rem;width:fit-content;transform:rotate(-1deg)}
#hero h1{margin-bottom:.8rem}
#hero .role-line{font-size:1.2rem;color:var(--ink-dim);min-height:1.6em}
#hero .role-line .caret{display:inline-block;width:.5ch;background:var(--ink);animation:blink 1s step-start infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
#hero .cta-row{display:flex;gap:1.1rem;margin-top:2.2rem;flex-wrap:wrap}
.btn{padding:.85rem 1.7rem;border-radius:18px 6px 18px 6px;font-weight:700;font-size:.9rem;display:inline-block;transition:transform .2s ease}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-ghost{background:var(--bg-band);color:var(--ink)}
.btn:hover{transform:rotate(-1.5deg) translateY(-2px)}

/* ---------- side dot nav (hand-drawn dots) ---------- */
.dotnav{position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:850;display:flex;flex-direction:column;gap:12px}
.dotnav button{width:9px;height:9px;border-radius:50% 40% 50% 40%;background:var(--g4);transition:all .25s}
.dotnav button.active{background:var(--ink);transform:scale(1.5) rotate(20deg)}
@media (max-width:800px){.dotnav{display:none}}

/* ---------- about + stats ---------- */
.about-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:2.6rem;align-items:start}
@media (max-width:760px){.about-grid{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.6rem}
.stat{text-align:center;transform:rotate(-1deg)}
.stat:nth-child(2){transform:rotate(1deg)}
.stat:nth-child(3){transform:rotate(-.5deg)}
.stat .num{font-size:1.7rem;font-weight:700}
.stat .label{font-size:.76rem;color:var(--ink-dim)}

.loc{font-size:.85rem;color:var(--ink-dim);margin:.5rem 0;display:block}
.essay{font-style:italic;margin-top:1rem}
.essay::before{content:"💭 ";font-style:normal}
.link-row{display:flex;gap:1.4rem;margin-top:1rem;flex-wrap:wrap}

/* ---------- timeline rail (Where I've worked only) — entry always visible ---------- */
#expAccordion{position:relative;padding-left:2.2rem}
#expAccordion::before{
  content:"";position:absolute;left:.5rem;top:.6rem;bottom:.6rem;width:2px;
  background:repeating-linear-gradient(to bottom,var(--ink-dim) 0 6px,transparent 6px 11px);opacity:.5;
}
.job-card{position:relative;margin-bottom:1.1rem}
.job-card:not(.sketch){padding:.4rem 0 1rem}
#expAccordion .job-card::before{
  content:"";position:absolute;left:-1.72rem;top:1.5rem;width:11px;height:11px;
  border-radius:50% 40% 50% 40%;background:var(--ink);transform:rotate(-8deg);z-index:1;
}
.job-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.job-head{display:flex;flex-direction:column;gap:.2rem}
.job-company{font-weight:700;font-size:1.02rem}
.job-role{font-size:.82rem;color:var(--ink-dim);font-style:italic}
.task-list{margin-top:.9rem}
.task-row{margin-bottom:.5rem}
.task-line{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer}
.task-plus{flex-shrink:0;font-size:1.05rem;line-height:1.5;transition:transform .3s ease;color:var(--ink-dim)}
.task-row.open .task-plus{transform:rotate(45deg)}
.task-line p{margin:0;color:var(--ink-dim);font-size:.92rem;line-height:1.55}
.task-detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1);margin-left:1.7rem}
.task-row.open .task-detail{grid-template-rows:1fr}
.task-detail-inner{overflow:hidden}
.task-detail-inner .in{background:var(--paper);border-radius:10px 3px 10px 3px;padding:.9rem 1.1rem;margin-top:.5rem}

/* ---------- skills: tabs + chips ---------- */
.tabbar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.7rem}
.tabbar button{padding:.5rem 1.1rem;border-radius:14px 5px 14px 5px;font-size:.85rem;color:var(--ink-dim);background:var(--bg-band)}
.tabbar button.active{background:var(--ink);color:var(--bg)}
.skill-panel{display:none}
.skill-panel.active{display:block}
.chip-grid{display:flex;flex-wrap:wrap;gap:.7rem}
.chip{
  position:relative;background:var(--bg-band);padding:.6rem 1rem .55rem;border-radius:12px 4px 12px 4px;
  font-size:.85rem;transition:background .2s,transform .2s;cursor:pointer;min-width:120px;
}
.chip:hover,.chip:focus{background:var(--surface-hi);transform:rotate(-1deg);outline:none}
.chip-name{display:block;margin-bottom:.45rem;white-space:nowrap}
.chip-bar-track{display:block;height:4px;background:var(--surface-hi);border-radius:99px;overflow:hidden}
.chip-bar-fill{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s ease}

/* ---------- skill detail modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:1.5rem}
.modal-overlay.open{display:flex}
.modal{background:var(--paper);border-radius:16px 6px 16px 6px;max-width:480px;width:100%;padding:2.1rem;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) rotate(-1deg)}to{opacity:1;transform:translateY(0) rotate(0)}}
.modal-close{position:absolute;top:1rem;right:1.2rem;font-size:1.4rem;color:var(--ink-dim);width:32px;height:32px;border-radius:50%}
.modal-close:hover{background:var(--bg-band)}
.modal ul{margin-top:.9rem}
.modal li{position:relative;padding-left:1.1rem;margin-bottom:.5rem;color:var(--ink-dim);font-size:.92rem}
.modal li::before{content:"✎";position:absolute;left:0;font-size:.8rem}

/* ---------- achievements ---------- */
.achieve-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.1rem}
.achieve-item{transform:rotate(-1deg)}
.achieve-item:nth-child(2n){transform:rotate(1deg)}
.achieve-item:nth-child(3n){transform:rotate(-.5deg)}
.achieve-item .icon{font-size:1.4rem;margin-bottom:.6rem}

/* ---------- testimonials: static board of pinned sticky notes, no motion ---------- */
/* few items (<=6): plain wrapping grid — fills 3-per-row, remainder wraps, no scroll needed */
.board-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1.6rem}

/* many items (>6): paginate into full pages of 6, pages scroll horizontally as a whole */
.board-wrap{position:relative}
.board-viewport{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none}
.board-viewport::-webkit-scrollbar{display:none}
.board-track{display:flex}
.board-page{
  flex:0 0 100%;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;
  gap:1.6rem;scroll-snap-align:start;padding:.2rem .2rem 1rem;
}
.board-arrow{
  position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50% 40% 50% 40%;
  background:var(--bg-band);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--ink);
  z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.18);transition:background .2s;
}
.board-arrow:hover{background:var(--surface-hi)}
.board-arrow.prev{left:-4px}
.board-arrow.next{right:-4px}
@media (max-width:760px){.board-arrow{display:none}}
.testi-note{
  background:var(--paper);border-radius:2px 10px 2px 10px;padding:1.6rem;position:relative;
  box-shadow:0 10px 24px rgba(0,0,0,.1);text-align:left;
}
.testi-note:nth-child(3n+1){transform:rotate(-2deg)}
.testi-note:nth-child(3n+2){transform:rotate(1.5deg)}
.testi-note:nth-child(3n){transform:rotate(-1deg)}
.testi-note::before{
  content:"";position:absolute;top:-10px;left:calc(50% - 22px);width:44px;height:18px;
  background:var(--g3);opacity:.6;border-radius:2px;transform:rotate(-3deg);
}
[data-mode="dark"] .testi-note::before{background:var(--g6)}
.testi-note p.quote{font-size:1.1rem;color:var(--ink);margin-bottom:1rem}
.testi-note .who{font-size:.83rem;color:var(--ink-dim)}

/* ---------- writing + contact ---------- */
.write-card.sketch{box-shadow:0 2px 6px rgba(0,0,0,.05)}
[data-mode="dark"] .write-card.sketch{background:var(--surface);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.write-card{display:flex;flex-direction:column;cursor:pointer;transition:transform .25s ease,box-shadow .2s}
.write-card-more{margin-top:auto;padding-top:.8rem;display:inline-block;width:fit-content}
.write-card:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 6px 14px rgba(0,0,0,.09)}
.write-card .date{font-size:.75rem;color:var(--ink-dim)}
.write-card h3{margin:.5rem 0}
#contact{text-align:center}
.contact-links{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1.9rem}
.contact-links a{background:var(--bg-band);padding:.75rem 1.5rem;border-radius:16px 5px 16px 5px;font-size:.9rem;transition:transform .2s,background .2s}
.contact-links a:hover{background:var(--ink);color:var(--bg);transform:rotate(-2deg)}
footer{padding:2.2rem 0;text-align:center;font-size:.8rem;color:var(--ink-dim)}

@media (max-width:760px){ section{padding-top:3.5rem;padding-bottom:3.5rem} }
</style>
</head>

/* squiggly underline link */
function uLink(text, href){
  return `<a class="u-link" href="${href}" target="_blank" rel="noopener">${text}<svg viewBox="0 0 100 8" preserveAspectRatio="none"><path d="M2 5 Q 15 1, 28 5 T 54 5 T 80 5 T 100 5"/></svg></a>`;
}
/* essay + link-row blocks — render nothing until real content exists */
function essayBlock(essay){
  return essay ? `<p class="essay">${essay}</p>` : '';
}
function linksBlock(links){
  if(links && (links.demo || links.source)){
    return `<div class="link-row">${links.demo?uLink('Live demo ↗', links.demo):''}${links.source?uLink('Source code ↗', links.source):''}</div>`;
  }
  return '';
}

    <span class="chip-bar-track"><span class="chip-bar-fill" style="width:${level}%"></span></span>
  </span>`;
};

/* few items → 1 row (side by side); once they'd need more than 2 rows worth, cap at 2 and scroll */
/* <=6 items: plain wrapping grid (3-per-row, remainder wraps, no scroll UI at all).
   >6 items: paginate into full pages of 6, pages scroll horizontally with arrows. */
function chunk(arr, size){
  const out = [];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out;
}
function renderBoard(id, items, renderItem){
  if(items.length <= 6){
    return `<div class="board-grid">${items.map(renderItem).join('')}</div>`;
  }
  const pages = chunk(items, 6).map(page => `<div class="board-page">${page.map(renderItem).join('')}</div>`).join('');
  return `
    <div class="board-wrap">
      <button class="board-arrow prev" data-target="${id}" aria-label="Scroll left">‹</button>
      <div class="board-viewport" id="${id}"><div class="board-track">${pages}</div></div>
      <button class="board-arrow next" data-target="${id}" aria-label="Scroll right">›</button>
    </div>`;
}

/* hero typewriter */
(function typewriter(){
  const node = document.getElementById('roleText');
  const roles = CONFIG.roles; let r=0,i=0,deleting=false;
  function tick(){
    const word = roles[r];
    node.textContent = deleting ? word.slice(0,i--) : word.slice(0,i++);
    let delay = deleting ? 35 : 70;
    if(!deleting && i>word.length){ deleting=true; delay=1200; }
    else if(deleting && i<0){ deleting=false; r=(r+1)%roles.length; delay=300; }
    setTimeout(tick, delay);
  }
  tick();
})();

    }
  });
},{threshold:0.2});

  entries.forEach(entry=>{
    if(entry.isIntersecting){
      dotnav.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.target===entry.target.id));
      navLinks.forEach(a=>a.classList.toggle('active', a.dataset.target===entry.target.id));
    }
  });
},{threshold:0.5});
SECTIONS.forEach(s=>{ const node=document.getElementById(s); if(node) navObserver.observe(node); });

function animateCounters(){
  document.querySelectorAll('[data-count]').forEach(node=>{
    const target = node.dataset.count, numeric = parseInt(target,10)||0;
    let cur=0; const step = Math.max(1,Math.ceil(numeric/40));
    const iv = setInterval(()=>{ cur+=step; if(cur>=numeric){node.textContent=target;clearInterval(iv);} else node.textContent=cur; },25);
  });
}

/* per-task expand (Where I've worked) — each task toggles independently */
document.getElementById('app').addEventListener('click', e=>{
  const line = e.target.closest('.task-line');
  if(line) line.closest('.task-row').classList.toggle('open');
});

/* board page arrows (testimonials + writing) — click to slide one full page, no auto-movement */
document.getElementById('app').addEventListener('click', e=>{
  const arrow = e.target.closest('.board-arrow');
  if(!arrow) return;
  const board = document.getElementById(arrow.dataset.target);
  const amount = board.clientWidth * (arrow.classList.contains('prev') ? -1 : 1);
  board.scrollBy({ left: amount, behavior: 'smooth' });
});

/* skills tabs */
document.getElementById('app').addEventListener('click', e=>{
  const tab = e.target.closest('#skillTabs button');
  if(tab){
    document.querySelectorAll('#skillTabs button').forEach(b=>b.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.skill-panel').forEach(p=>p.classList.remove('active'));
    document.querySelector(`.skill-panel[data-panel="${tab.dataset.cat}"]`).classList.add('active');
  }
});

/* skill chip click → detail modal */
const skillModalOverlay = document.getElementById('skillModalOverlay'), skillModalBody = document.getElementById('skillModalBody');
document.getElementById('app').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  const skill = CONFIG.skills.data[chip.dataset.cat][chip.dataset.idx];
  const details = (skill.details && skill.details.length) ? skill.details : [{ text: "Used across recent projects.", links: { demo: "", source: "" } }];
  skillModalBody.innerHTML = `<h2>${skill.name}</h2><ul>${details.map(d=>`<li>${d.text}${linksBlock(d.links)}</li>`).join('')}</ul>`;
  skillModalOverlay.classList.add('open');
});
document.getElementById('skillModalClose').addEventListener('click', ()=>skillModalOverlay.classList.remove('open'));
skillModalOverlay.addEventListener('click', e=>{ if(e.target===skillModalOverlay) skillModalOverlay.classList.remove('open'); });

</script>
</body>
